server:
  # Render (y otras plataformas) indican el puerto con la variable PORT.
  port: ${PORT:8080}
spring:
  application:
    name: "zpenz"
  devtools:
    add-properties: false
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        # Solo health es público. Las métricas (prometheus) se vuelven a exponer,
        # con protección, en la Fase 8 (observabilidad).
        include: "health"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
