package=io.github.morganbyte.zpenz
systemProp.version=5.4.0
javaVersion=21
reactive=false
lombok=false
metrics=true
# No enviar datos de uso del plugin de Bancolombia a Google Analytics
analytics=false
# comma separated module names to exclude completely from the Gradle build
excludeModule=
# comma separated module names to exclude only as app-service dependencies
excludeModuleFromApp=
language=java
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.integrity-check=false
org.gradle.configuration-cache.read-only=false
systemProp.sonar.gradle.skipCompile=true
# Maven Central responde 429 (Too Many Requests) a las IPs compartidas de los
# runners de GitHub. Gradle reintenta el 429, pero por defecto solo 3 veces
# desde 125 ms. Con esto espera 2 s, 4 s, 8 s... hasta 6 intentos (~1 min).
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=2000
