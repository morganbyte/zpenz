name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Valida el checksum del wrapper y cachea dependencias de Gradle.
      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar, probar y generar cobertura
        run: ./gradlew build

      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            build/reports/
            **/build/reports/
            **/build/test-results/
          retention-days: 14
