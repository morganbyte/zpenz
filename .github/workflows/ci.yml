name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Valida el checksum del wrapper y cachea dependencias de Gradle.
      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar, probar y generar cobertura
        run: ./gradlew build

      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            build/reports/
            **/build/reports/
            **/build/test-results/
          retention-days: 14

  docker:
    name: Construir imagen y verificar healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # La caché de capas evita descargar Gradle y las dependencias en cada
      # ejecución, lo que reduce los errores 429 (Too Many Requests) de Maven Central.
      - name: Construir imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/Dockerfile
          tags: zpenz:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Desde la Fase 2 la aplicación no arranca sin base de datos (ADR-0007).
      - name: Levantar PostgreSQL
        run: |
          docker network create zpenz
          docker run -d --name db --network zpenz \
            -e POSTGRES_DB=zpenz -e POSTGRES_USER=zpenz -e POSTGRES_PASSWORD=zpenz \
            postgres:17-alpine
          # Por TCP: durante la inicialización la imagen levanta un servidor temporal
          # que solo escucha por socket local.
          for i in $(seq 1 60); do
            if docker exec db pg_isready -h 127.0.0.1 -U zpenz -d zpenz >/dev/null; then
              echo "PostgreSQL listo tras ${i}s"; exit 0
            fi
            sleep 1
          done
          docker logs db
          exit 1

      - name: Levantar el contenedor y esperar a /actuator/health
        run: |
          docker run -d --name zpenz --network zpenz -p 8080:10000 -m 512m \
            -e PORT=10000 \
            -e DB_URL=jdbc:postgresql://db:5432/zpenz -e DB_USERNAME=zpenz -e DB_PASSWORD=zpenz \
            -e API_TOKEN=token-de-ci-0123456789abcdef0123456789 \
            -e RENDER_GIT_COMMIT=${{ github.sha }} \
            zpenz:ci
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Healthcheck UP tras ${i}s"
              curl -sf http://localhost:8080/actuator/info | grep -q '"commit":"${{ github.sha }}"' \
                || { echo "/actuator/info no reporta el commit"; curl -s http://localhost:8080/actuator/info; exit 1; }
              # La API exige el token (ADR-0008): sin él responde 401.
              status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/accounts)
              [ "$status" = "401" ] || { echo "/accounts sin token respondió $status, se esperaba 401"; exit 1; }
              exit 0
            fi
            sleep 1
          done
          docker logs zpenz
          exit 1

      - name: Detener los contenedores
        if: always()
        run: |
          docker rm -f zpenz db || true
          docker network rm zpenz || true
