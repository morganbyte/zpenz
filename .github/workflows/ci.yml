name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Valida el checksum del wrapper y cachea dependencias de Gradle.
      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar, probar y generar cobertura
        run: ./gradlew build

      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            build/reports/
            **/build/reports/
            **/build/test-results/
          retention-days: 14

  docker:
    name: Construir imagen y verificar healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagen
        run: docker build -f deployment/Dockerfile -t zpenz:ci .

      - name: Levantar el contenedor y esperar a /actuator/health
        run: |
          docker run -d --name zpenz -e PORT=10000 -p 8080:10000 -m 512m zpenz:ci
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Healthcheck UP tras ${i}s"; exit 0
            fi
            sleep 1
          done
          docker logs zpenz
          exit 1

      - name: Detener el contenedor
        if: always()
        run: docker rm -f zpenz || true
